# tvOS feasibility probe for WiiCompiled's Aurora layer.
#
# Goal: find out whether Aurora (SDL3 + Dawn/Metal) configures and builds for tvOS.
# This is an experiment. I haven't seen Aurora's CMakeLists, so the path and the
# options below are educated guesses. Read the logs, then adjust.
#
# Setup: put this file at .github/workflows/tvos-probe.yml in YOUR FORK of
# patchzyy/Wiicompiled, then Actions > "tvOS probe" > Run workflow.
#
# Safety: this touches no game data. Never put a disc image, extracted game files
# or translated output in a repo or workflow artifact. Public-repo logs are public.

name: tvOS probe

on:
  workflow_dispatch:
    inputs:
      aurora_dir:
        description: Directory containing Aurora's CMakeLists.txt
        default: aurora-main

jobs:
  probe:
    runs-on: macos-latest
    timeout-minutes: 150   # Dawn can take a long time if it builds from source
    env:
      AURORA_DIR: ${{ inputs.aurora_dir }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Environment
        run: |
          sw_vers
          uname -m
          xcodebuild -version
          xcodebuild -showsdks | grep -i tv || true
          cmake --version

      - name: Install tools
        run: brew install ninja || true

      - name: Locate Aurora
        run: |
          ls -la
          ls -la "$AURORA_DIR" || true
          find . -maxdepth 3 -name CMakeLists.txt -not -path './.git/*' | head -30

      - name: Configure for tvOS simulator
        continue-on-error: true
        run: |
          set -o pipefail
          cmake -S "$AURORA_DIR" -B build-tvos -G Xcode \
            -DCMAKE_SYSTEM_NAME=tvOS \
            -DCMAKE_OSX_SYSROOT=appletvsimulator \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DAURORA_SDL3_PROVIDER=vendor 2>&1 | tee configure.log

      - name: Build
        continue-on-error: true
        run: |
          set -o pipefail
          cmake --build build-tvos --config Release 2>&1 | tee build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-probe-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

# Not covered here: building the full runtime/. It needs generated sources produced
# by the translator from YOUR disc image, so it can't run in CI without game data.
